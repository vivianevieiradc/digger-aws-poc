name: Digger PoC

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: read
  statuses: write
  actions: write

jobs:
  digger:
    name: Terraform Plan via Digger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS Emulator
        run: |
          curl -fsSLo /tmp/aws-emulator.deb \
            https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb

          sudo apt-get install -y /tmp/aws-emulator.deb

      - name: Start AWS Emulator
        run: |
          aws-emulator > /tmp/aws-emulator.log 2>&1 &
          sleep 10

          mkdir -p "$HOME/.aws/emulator/9297"

          for i in $(seq 1 20); do
            if [ -f "$HOME/.aws/emulator/9297/emulator_credentials" ]; then
              break
            fi
            sleep 2
          done

          test -f "$HOME/.aws/emulator/9297/emulator_credentials"

      - name: Configure Emulator credentials
        run: |
          echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials" >> "$GITHUB_ENV"
          echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=test" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=test" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"

      - name: Validate S3 Emulator
        run: |
          aws s3api list-buckets \
            --endpoint-url https://127.0.0.1:9297

      - name: Run Digger
        uses: diggerhq/digger@vLatest
        with:
          no-backend: true
          disable-locking: true
          setup-terraform: true
          terraform-version: 1.16.2
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
